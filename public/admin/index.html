<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel TV — Administración</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <!-- Pantalla de login -->
  <div id="loginView" class="login">
    <form id="loginForm" class="login-box">
      <h1>🏨 Hotel TV</h1>
      <p class="sub">Panel de administración</p>
      <label>Usuario
        <input name="username" autocomplete="username" required>
      </label>
      <label>Contraseña
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="primary">Entrar</button>
      <p id="loginError" class="error"></p>
    </form>
  </div>

  <!-- Aplicación -->
  <div id="appView" class="app hidden">
    <header class="topbar">
      <div class="brand">🏨 <span>Hotel TV — Administración</span></div>
      <button id="logoutBtn" class="ghost">Cerrar sesión</button>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-head">
          <h3>Secciones</h3>
          <button id="newSectionBtn" class="primary small">+ Nueva</button>
        </div>
        <div id="sectionsList"></div>
      </aside>

      <main class="main">
        <div class="main-head">
          <h2 id="sectionTitle">Selecciona una sección</h2>
          <button id="newItemBtn" class="primary">+ Nuevo ítem</button>
        </div>
        <div id="itemsList"></div>
      </main>
    </div>
  </div>

  <!-- Modal para formularios -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modalTitle"></h3>
        <button id="modalClose" class="ghost">✕</button>
      </div>
      <form id="modalForm"></form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="admin.js"></script>
</body>
</html>
