# Blueprint de Render para "Channel Manager"
# Crea el servicio automáticamente al conectar el repositorio desde Render.
services:
  - type: web
    name: channel-manager
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: SERVICE_API_KEY
        generateValue: true
      # Cadena de conexión de Neon (postgresql://...?sslmode=require). Sin ella se usa una base temporal.
      - key: DATABASE_URL
        sync: false
